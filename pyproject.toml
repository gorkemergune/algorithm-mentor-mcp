[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-mentor-mcp"
version = "0.1.0"
description = "Adaptive algorithm practice MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0", "anyio>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
